<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="theme-color"
      content="#f4f4f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1012"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="twitter:creator" content="@crashnaut" />
    <meta name="twitter:site" content="@crashnaut" />
    <meta name="twitter:domain" content="crashnaut.com" />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="Crashnaut · the crash log"
      href="/blog/rss.xml"
    />

    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicons/favicon-32x32.png"
    />
    <link rel="alternate icon" href="/favicons/favicon.ico" sizes="any" />

    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag("js", new Date())
    </script>
    %sveltekit.head%
    <script>
      const theme = localStorage.getItem("theme")
      if (theme) {
        document.documentElement.classList.add(
          theme === "dark" ? "dark" : "light",
        )
      } else if (
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches
      ) {
        document.documentElement.classList.add("dark")
      } else {
        document.documentElement.classList.add("light")
      }
    </script>
  </head>
  <body>
    <div style="display: contents" data-sveltekit-preload-data="hover">
      %sveltekit.body%
    </div>
  </body>
</html>
