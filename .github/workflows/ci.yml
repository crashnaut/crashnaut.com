name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public GA4 measurement ID (Settings → Secrets and variables → Actions → Variables)
  VITE_PUBLIC_GA_TRACKING_ID: ${{ vars.GA_MEASUREMENT_ID }}
  VITE_PUBLIC_HASH: ${{ github.sha }}
  # Deploy steps are skipped until the service-account secret exists
  HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run lint:posts
      - run: npm run test:unit

      - name: Warn when analytics is not configured
        if: env.VITE_PUBLIC_GA_TRACKING_ID == ''
        run: echo "::warning::GA_MEASUREMENT_ID repo variable is not set, so the build ships without analytics."

      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # Preview channel per pull request (link is posted as a PR comment)
      - name: Deploy preview
        if: env.HAS_FIREBASE == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: crashnaut
          expires: 7d

      - name: Deploy live
        if: env.HAS_FIREBASE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: crashnaut
          channelId: live
